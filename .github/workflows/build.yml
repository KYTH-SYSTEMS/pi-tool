name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  # Dependency PRs (Dependabot) used to arrive with NO check at all, so the only
  # way to judge them was to merge and see. A PR now gets analyze + test + a
  # debug APK build — the APK matters because plugin bumps break at the
  # Gradle/native layer, not in the Dart analyzer. Nothing is signed, uploaded
  # or published on this path: releasing stays tied to a v* tag.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      play_dry_run:
        description: 'Play-Upload nur validieren (validate_only) — lädt nichts hoch'
        type: boolean
        default: false

permissions:
  contents: write # needed to create a Release on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Only a boolean is job-wide; the secret VALUES are env-scoped to the
      # "Configure release signing" step. The materialized keystore +
      # key.properties FILES are then deleted right after the builds (see the
      # cleanup step) so the later third-party upload/publish actions can't read
      # them from the workspace either.
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      # Same pattern for the Play publishing credentials: only the boolean is
      # job-wide, the JSON itself is env-scoped to the publish step.
      HAS_PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      # Publishing needs BOTH secrets: without the keystore there is no AAB.
      CAN_PUBLISH_PLAY: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}

    steps:
      # Third-party actions pinned to full commit SHAs (a mutable @vX tag could
      # be hijacked to run with workspace/token access). Update the SHA + the
      # trailing version comment together when bumping.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # A tagged build publishes straight to the Play production track at 100 %,
      # so the store texts go live with it. Validate them BEFORE building: the
      # changelog for this versionCode must exist and every text must fit the
      # Play limits (title 30, short 80, full 4000, changelog 500 characters —
      # counted after trailing whitespace, exactly as Play counts them).
      - name: Check store texts against Play limits
        if: startsWith(github.ref, 'refs/tags/') || inputs.play_dry_run
        run: |
          CODE="$(grep -m1 '^version:' pubspec.yaml | sed 's/.*+//' | tr -d '[:space:]')"
          echo "versionCode: ${CODE}"
          python3 - "$CODE" <<'PY'
          import sys, pathlib
          code = sys.argv[1]
          limits = [('title.txt', 30), ('short_description.txt', 80),
                    ('full_description.txt', 4000), (f'changelogs/{code}.txt', 500)]
          bad = False
          for loc in ('de-DE', 'en-US'):
              for rel, limit in limits:
                  p = pathlib.Path('fastlane/metadata/android') / loc / rel
                  if not p.is_file():
                      print(f'::error::missing {p}')
                      bad = True
                      continue
                  n = len(p.read_text(encoding='utf-8').rstrip())
                  flag = '::error::' if n > limit else ''
                  print(f'{flag}{p}: {n}/{limit} characters')
                  bad = bad or n > limit
          if bad:
              print('::error::store texts are not publishable — fix them before tagging')
              sys.exit(1)
          PY

      - name: Require signing secret for tagged releases
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::KEYSTORE_BASE64 is not set — refusing to publish an unsigned release."
          exit 1

      - name: Configure release signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Fat APK with both ARM ABIs (64- + 32-bit) so it installs on every real
      # phone — arm64-only would fail to install on armeabi-v7a devices. x86_64
      # (emulator-only) is left out to keep the size down.
      # On a PR only a compile check is needed, and an unsigned release build
      # would just burn minutes: arm64 debug is enough to catch a plugin that
      # no longer builds.
      - name: Build debug APK (PR compile check)
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug --target-platform android-arm64

      - name: Build release APK (arm64 + armeabi-v7a)
        if: github.event_name != 'pull_request'
        run: flutter build apk --release --target-platform android-arm64,android-arm

      # Play Store wants an App Bundle (.aab). Built only when signing is
      # configured; kept as a CI artifact (NOT attached to the public release,
      # so friends only ever see the installable .apk). Built here — before the
      # signing material is wiped — so both artifacts exist first.
      - name: Build release App Bundle (Play Store)
        if: env.HAS_KEYSTORE == 'true'
        run: flutter build appbundle --release

      # Delete the keystore + plaintext key.properties from the workspace before
      # any third-party action runs, so a compromised upload/publish action
      # can't exfiltrate the release signing key. Runs even if a build failed.
      - name: Remove signing material before third-party steps
        if: ${{ always() && env.HAS_KEYSTORE == 'true' }}
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-tool-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Play Store AAB artifact
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-tool-playstore-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Human-readable release notes: use the curated per-version changelog
      # (fastlane, DE + EN) as the release body, so each release LISTS its
      # actual changes instead of only the auto-generated commit list. The
      # changelog file is named by the Android versionCode (the `+NN` in
      # pubspec version).
      - name: Compose release notes from the changelog
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_KEYSTORE == 'true'
        run: |
          CODE="$(grep -m1 '^version:' pubspec.yaml | sed 's/.*+//' | tr -d '[:space:]')"
          DE="fastlane/metadata/android/de-DE/changelogs/${CODE}.txt"
          EN="fastlane/metadata/android/en-US/changelogs/${CODE}.txt"
          {
            if [ -f "$DE" ]; then echo "## Was ist neu"; echo; cat "$DE"; echo; fi
            if [ -f "$EN" ]; then echo "## What's new"; echo; cat "$EN"; echo; fi
          } > RELEASE_NOTES.md
          echo "---- release notes (versionCode ${CODE}) ----"; cat RELEASE_NOTES.md

      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          # Curated changelog first; the auto-generated commit list is appended
          # below it (generate_release_notes).
          body_path: RELEASE_NOTES.md
          generate_release_notes: true

      # ---- Play Store ------------------------------------------------------
      # Deliberately the LAST steps: a hiccup on Google's side must not cost the
      # sideload users their .apk download, so the GitHub release is created
      # first. The signing keystore is already wiped from the workspace here,
      # and the service-account JSON is handed to fastlane as raw env data
      # (fastlane/Fastfile reads PLAY_SERVICE_ACCOUNT_JSON) — it never touches
      # the disk. Uploads the AAB to production at 100 % plus the store texts
      # from fastlane/metadata/**; images/screenshots are skipped on purpose.
      - name: Warn if Play publishing is not configured
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_PLAY_SA != 'true'
        run: echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is not set — skipping the Play Store upload (the GitHub release was still published)."

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        if: (startsWith(github.ref, 'refs/tags/') || inputs.play_dry_run) && env.CAN_PUBLISH_PLAY == 'true'
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        if: (startsWith(github.ref, 'refs/tags/') || inputs.play_dry_run) && env.CAN_PUBLISH_PLAY == 'true'
        run: gem install fastlane -N -v 2.237.0

      - name: Publish to Play Store (production, 100 % rollout)
        if: startsWith(github.ref, 'refs/tags/') && env.CAN_PUBLISH_PLAY == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
        run: fastlane android play_release

      # Manual smoke test for the whole publish chain (credentials, permissions,
      # metadata) without releasing anything: run the workflow via
      # "Run workflow" with play_dry_run = true.
      - name: Validate Play upload only (dry run)
        if: inputs.play_dry_run && env.CAN_PUBLISH_PLAY == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
        run: fastlane android play_validate
